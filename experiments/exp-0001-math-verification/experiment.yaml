id: exp-0001
name: math-verification-deterministic-tool
version: "0.4"
status: planned

question: "¿La verificación determinista y la reparación basada en ella mejoran la fiabilidad matemática frente a generación directa?"

conditions:
  baseline:
    mode: direct
    repair: false
  verified:
    mode: verify
    repair: false
  verified_repair:
    mode: verify
    repair: true

design:
  paired_initial_generation: true
  unit_of_comparison: task
  baseline_and_verified_share_initial_response: true
  verified_repair_adds_second_generation_only_after_initial_verification_failure: true

baseline:
  mode: direct
  model: TBD

intervention:
  mode: verified
  verifier: sympy
  model: same_as_baseline
  repair_is_separate_condition: true

controls:
  dataset_version: "0.1"
  temperature: 0.0
  max_tokens: -1
  max_tokens_mode: unlimited
  seed: TBD
  timeout_seconds: 0
  timeout_mode: unlimited
  same_model: true
  same_dataset: true
  same_generation_prompt: true
  paired_initial_generation: true

metrics:
  generation:
    - exact_accuracy
    - semantic_accuracy
    - contains_expected_accuracy
    - tokens
    - average_tokens
    - latency_ms
    - average_latency_ms
    - generation_latency_ms
    - average_generation_latency_ms
  verification:
    - verification_success_rate
    - initial_verification_success_rate
    - detected_errors
    - detection_rate
    - verifier_false_rejection
    - verification_latency_ms
    - average_verification_latency_ms
    - oracle_latency_ms
    - average_oracle_latency_ms
  repair:
    - repair_attempts
    - repair_successes
    - repair_success_rate
    - repair_latency_ms
    - average_repair_latency_ms
    - observed_latency_ms
    - average_observed_latency_ms

decision:
  compare_conditions: [baseline, verified, verified_repair]
  require_same_protocol: true
  repair_is_an_additional_generation: true
  promote_only_from_single_metric: false

artifacts:
  - dataset
  - model_responses
  - verifier_results
  - metrics
  - configuration
  - trace
  - report
