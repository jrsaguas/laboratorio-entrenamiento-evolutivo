name: Python tests

on:
  push:
    branches:
      - main
      - exp-0002-model-comparison
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pip sympy
      - name: Compile Python modules
        run: python -m compileall -q agents evaluation experiments laboratory models orchestrator retrieval tools tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
